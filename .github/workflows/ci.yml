name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academic_predictor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Enable citext extension
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d academic_predictor -c "CREATE EXTENSION IF NOT EXISTS citext;"

      - name: Lint (ruff)
        working-directory: backend
        run: |
          pip install ruff
          ruff check app tests

      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/academic_predictor
        run: alembic upgrade head

      - name: Generate synthetic dataset + train models
        # The backend test suite exercises the real prediction endpoint, which
        # loads a real model registry — so CI must produce one, exactly like
        # a fresh local dev setup would (see docs/deployment.md).
        run: |
          python scripts/generate_dataset.py --n 1500 --seed 42 --out data/synthetic/students_synthetic_v1.csv
          python ml/training/train.py --data data/synthetic/students_synthetic_v1.csv --registry ml/inference/registry --dataset-version ci

      - name: Run backend + ML tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/academic_predictor
          SECRET_KEY: ci-test-secret-key
        run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check + build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
        run: npm run build

  build-validation:
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t academic-predictor-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t academic-predictor-frontend:ci ./frontend
